name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  verify:
    name: Build, Test & Security Verification
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Verify zero-INTERNET manifest security policy
        run: |
          if grep -q "android.permission.INTERNET" app/src/main/AndroidManifest.xml; then
            echo "SECURITY VIOLATION: android.permission.INTERNET is forbidden in MVP!"
            exit 1
          fi
          echo "Manifest verified: zero-INTERNET policy enforced."

      - name: Run Core Domain unit tests
        run: ./gradlew :core-domain:test --no-daemon

      - name: Run Android App unit tests & Room verification
        run: ./gradlew :app:testDebugUnitTest --no-daemon
