name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    name: Build & Draft Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Verify zero-INTERNET manifest security policy
        run: |
          if grep -q "android.permission.INTERNET" app/src/main/AndroidManifest.xml; then
            echo "SECURITY VIOLATION: android.permission.INTERNET is forbidden in MVP!"
            exit 1
          fi
          echo "Manifest verified: zero-INTERNET policy enforced."

      - name: Decode Production Keystore (if configured)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Decoding production signing keystore..."
            echo "$KEYSTORE_BASE64" | base64 -d > release.keystore
            echo "KEYSTORE_PATH=$GITHUB_WORKSPACE/release.keystore" >> $GITHUB_ENV
          else
            echo "No production keystore provided; falling back to debug keystore for release artifact generation."
          fi

      - name: Build Release APKs (ABI splits & Universal)
        env:
          KEYSTORE_PATH: ${{ env.KEYSTORE_PATH }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Verify APK Sizes (<30 MB budget per split)
        run: |
          echo "=== Release APK Size Report ==="
          ls -la app/build/outputs/apk/release/
          
          # Check size budget for arm64-v8a split (< 30 MB / 31,457,280 bytes)
          ARM64_APK=$(ls app/build/outputs/apk/release/*arm64-v8a*.apk | head -n 1)
          ARM64_SIZE=$(stat -c%s "$ARM64_APK" 2>/dev/null || stat -f%z "$ARM64_APK")
          echo "arm64-v8a ($ARM64_APK) size: $ARM64_SIZE bytes"
          if [ "$ARM64_SIZE" -gt 31457280 ]; then
            echo "ERROR: arm64-v8a APK exceeded 30 MB budget!"
            exit 1
          fi
          
          # Check size budget for armeabi-v7a split (< 30 MB / 31,457,280 bytes)
          ARMV7_APK=$(ls app/build/outputs/apk/release/*armeabi-v7a*.apk | head -n 1)
          ARMV7_SIZE=$(stat -c%s "$ARMV7_APK" 2>/dev/null || stat -f%z "$ARMV7_APK")
          echo "armeabi-v7a ($ARMV7_APK) size: $ARMV7_SIZE bytes"
          if [ "$ARMV7_SIZE" -gt 31457280 ]; then
            echo "ERROR: armeabi-v7a APK exceeded 30 MB budget!"
            exit 1
          fi
          
          echo "All ABI splits comply with the <30 MB size budget."

      - name: Draft GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          prerelease: false
          generate_release_notes: true
          files: |
            app/build/outputs/apk/release/*.apk
